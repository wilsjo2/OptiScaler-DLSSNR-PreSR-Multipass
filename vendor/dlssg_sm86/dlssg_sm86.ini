; DLSSG SM86 - frame generation for Ampere (RTX 30) and newer.
; Deploy only version.dll (or one alternative proxy from alternatives\ - winmm/dxgi/d3d12/dbghelp/dinput8, see
; alternatives\README.md) and this INI beside the rendering EXE. If several of these proxies end up in one folder,
; the first one the game loads runs the mod and the others only forward, so nothing breaks - but one is enough.
; The DLSS-G runtime, models and SM86 backend are all embedded in the proxy DLL. Restart the game after changing this.
; This is the full release configuration: four consistency tiers. Every diagnostic / compatibility / performance knob
; still works but is left out here and takes its safe, validated default; the complete list is in docs\INSTALL.md
; (advanced / diagnostic keys).
; RTX 20 (Turing) 用这份文件即可，不需要加任何键：内核族按物理显卡自动选到 SM75，游戏那道架构闸门也自动放行。
; 其余进阶键（Router / SM75Family / KernelImage / SpoofArchToGame / 抓取与诊断等）全部见 docs\INSTALL.md。

[General]
; 1 = frame generation on (our bundled, Ampere-optimized DLSS-G runtime). 0 = off: the game's own DLSS-G loads
; unchanged, which means no frame generation on Ampere. The proxy still forwards the real system DLL either way.
Enabled=1

[FrameGeneration]
; Consistency tier: how far the generated image may move from what the official NVIDIA runtime would produce.
; 一致性档位：允许生成的画面偏离官方运行库多远。数字越大越快、离官方画面越远。
; 0 = stock, the runtime's original numerics only / 原厂内核，不做任何加速（最保守）
; 1 = every acceleration that keeps the output BIT-IDENTICAL to the official runtime (recommended, default)
;     / 全部逐位一致的加速（推荐，默认；画面与官方完全相同）
; 2 = tier 1 plus the lossy image kernels that stay above ~50 dB PSNR against the official output, 310.9 build only
;     / 在档位 1 上再加有损图像内核（对官方输出 PSNR 仍在 ~50 dB 以上），仅 310.9 构建
; 3 = everything lossy that is still faster / 全部有损加速（画质代价最大，最快）
; Tiers 2 and 3 are not bit-exact; a 310.1 build silently runs tier 2/3 as tier 1. 310.1 构建上 2/3 等同于 1。
Optimized=1
; Frame-generation multiplier ceiling: 3 = up to 4X (factory default), 5 = up to 6X on the 310.9 build only.
; The game requests its own count within this; a game with dynamic MFG otherwise runs at the maximum by default, which
; users found too high (issues #497/#499). A game whose own Streamline plugin is 4X stays at 4X either way.
; Clamped to what the bundled runtime supports: 6X on the 310.9 build, 4X on the 310.1 build.
MaxGeneratedFrames=3

[Compatibility]
; DLSS-G render preset (UI recomposition), 310.9 build only. Auto = let the game / driver profile decide (default).
; A = force UI recomposition off. B = force it on (cleaner HUD/UI inside generated frames), but B only takes effect
; when the game hands DLSS-G both a HUD-less image and a UI plane; most games do not, and then B is a no-op. 310.1 ignores this.
Preset=Auto

[Logging]
; 0 = off, 1 = errors, 2 = configuration and capability, 3 = kernel and evaluation traces. Written to Directory.
Level=1
Directory=dlssg_sm86\logs

[Runtime]
; Bundled = always use the embedded, matched runtime and backend (normal use; no game DLL version matching).
Mode=Bundled
; Empty uses %LOCALAPPDATA%\DlssgSm86\bundles. A relative path is based on this INI's folder.
CacheDirectory=
