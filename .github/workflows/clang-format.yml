name: clang-format Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run clang-format style check for C/C++/Protobuf programs.
      uses: jidicula/clang-format-action@v4.15.0
      with:
        clang-format-version: '20'
        check-path: 'OptiScaler'
        # Shader byte arrays are generated by shader_tools/create_header.py.
        exclude-regex: 'external/|OptiScaler/include/|OptiScaler/shaders/.*/precompile(d)?/.*\.h$'
